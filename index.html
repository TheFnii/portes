<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Les Portes du Destin</title>
  <meta name="description" content="Le jeu des 12 portes, pour animer les lives de voyance.">
  <meta name="theme-color" content="#07100b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" href="fonts/cinzel-0.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/scene.css">
  <link rel="stylesheet" href="css/doors.css">
  <link rel="stylesheet" href="css/ui.css">
</head>
<body class="at-home">
  <svg class="defs" aria-hidden="true" width="0" height="0"><defs id="flower-defs"></defs></svg>

  <!-- Décor du jardin (plein écran) -->
  <div class="backdrop" id="backdrop"></div>

  <!-- Scène du jeu : 1500 × 1000 unités, mise à l'échelle de l'écran -->
  <div class="stage-veil" aria-hidden="true"></div>
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <svg class="plaza" id="plaza" viewBox="0 0 1500 1000"></svg>
      <div class="doors" id="doors"></div>
      <div class="stage-title" id="stage-title">
        <h2 id="stage-heading">Choisissez un chiffre de 1 à 12</h2>
        <div class="flourish" aria-hidden="true"></div>
        <p id="stage-tagline">Si le dé ouvre votre porte, on répond à votre question</p>
      </div>
      <canvas class="dice-canvas" id="dice"></canvas>
      <div class="dice-number" id="dice-number" aria-live="polite"></div>
      <div class="stage-actions">
        <button class="btn btn-primary btn-roll" id="btn-main" type="button">Lancer le dé</button>
      </div>

      <!-- Panneaux du mode TikTok -->
      <section class="live-panel live-players" id="panel-players" hidden>
        <h3>Participants <span class="count" id="players-count">0</span></h3>
        <ul class="feed" id="players-feed"></ul>
      </section>
      <section class="live-panel live-out" id="panel-out" hidden>
        <h3>Éliminés <span class="count" id="out-count">0</span></h3>
        <ul class="feed out" id="out-list"></ul>
      </section>
    </div>
  </div>

  <!-- Porte agrandie + résultat -->
  <div class="focus" id="focus" hidden>
    <div class="focus-veil"></div>
    <div class="focus-door" id="focus-door"></div>
    <section class="result" id="result" hidden>
      <div class="result-inner" id="result-inner"></div>
      <div class="result-actions">
        <button class="btn btn-primary" id="btn-again" type="button">Nouvelle partie</button>
        <button class="btn" id="btn-back" type="button">Retour aux portes</button>
      </div>
    </section>
  </div>

  <canvas class="fx" id="fx" aria-hidden="true"></canvas>

  <!-- Accueil -->
  <section class="home" id="home">
    <div class="home-veil"></div>
    <div class="home-content">
      <p class="home-kicker">✦ Jeu de voyance ✦</p>
      <h1 class="home-title">Les Portes<br><span>du Destin</span></h1>
      <div class="flourish" aria-hidden="true"></div>
      <nav class="home-menu" id="home-menu">
        <button class="btn btn-menu" data-go="simple" type="button">
          <span class="btn-icon" aria-hidden="true">🚪</span>
          <span><strong>Jeu des Portes</strong><small>Le dé choisit une porte</small></span>
        </button>
        <button class="btn btn-menu" data-go="live" type="button">
          <span class="btn-icon" aria-hidden="true">✨</span>
          <span><strong>Jeu des Portes · TikTok</strong><small>Le chat participe, les gagnants s’affichent</small></span>
        </button>
        <button class="btn btn-menu btn-toggle" data-toggle="ticker" type="button" aria-pressed="true">
          <span class="btn-icon" aria-hidden="true">📜</span>
          <span><strong>Messages défilants</strong><small class="state"></small></span>
          <span class="switch" aria-hidden="true"></span>
        </button>
        <button class="btn btn-menu" data-action="screensaver" type="button">
          <span class="btn-icon" aria-hidden="true">🌙</span>
          <span><strong>Écran de veille</strong><small>Seulement les messages, en plein écran</small></span>
        </button>
      </nav>
    </div>
    <div class="home-corner">
      <button class="icon-btn fullscreen-btn" data-action="fullscreen" type="button" title="Plein écran" aria-label="Plein écran">⛶</button>
      <a class="icon-btn" href="admin.html" title="Réglages" aria-label="Réglages">⚙</a>
    </div>
  </section>

  <!-- Menu du jeu -->
  <button class="icon-btn game-menu-btn" id="btn-game-menu" type="button" aria-label="Menu du jeu" aria-expanded="false">☰</button>
  <button class="live-status" id="live-status" type="button" hidden>
    <span class="dot"></span><span class="label">Non connecté</span>
  </button>
  <aside class="drawer" id="drawer" hidden>
    <h2>Menu du jeu</h2>
    <button class="btn btn-menu" data-action="home" type="button">
      <span class="btn-icon" aria-hidden="true">⌂</span><span><strong>Accueil</strong></span>
    </button>
    <button class="btn btn-menu btn-toggle" data-toggle="ticker" type="button" aria-pressed="true">
      <span class="btn-icon" aria-hidden="true">📜</span>
      <span><strong>Messages défilants</strong><small class="state"></small></span>
      <span class="switch" aria-hidden="true"></span>
    </button>
    <button class="btn btn-menu btn-toggle" data-toggle="sound" type="button" aria-pressed="true">
      <span class="btn-icon" aria-hidden="true">♪</span>
      <span><strong>Son</strong><small class="state"></small></span>
      <span class="switch" aria-hidden="true"></span>
    </button>
    <button class="btn btn-menu live-only" data-action="reset" type="button">
      <span class="btn-icon" aria-hidden="true">↺</span>
      <span><strong>Nouvelle partie</strong><small>Efface les participants</small></span>
    </button>
    <button class="btn btn-menu" data-action="screensaver" type="button">
      <span class="btn-icon" aria-hidden="true">🌙</span>
      <span><strong>Écran de veille</strong><small>Seulement les messages</small></span>
    </button>
    <button class="btn btn-menu fullscreen-btn" data-action="fullscreen" type="button">
      <span class="btn-icon" aria-hidden="true">⛶</span><span><strong>Plein écran</strong></span>
    </button>
    <a class="btn btn-menu" href="admin.html">
      <span class="btn-icon" aria-hidden="true">⚙</span>
      <span><strong>Réglages</strong><small>Connexion TikTok, messages</small></span>
    </a>
  </aside>

  <!-- Bandeau des messages défilants -->
  <div class="ticker off" id="ticker">
    <div class="ticker-track" id="ticker-track"></div>
  </div>

  <!-- Écran de veille : seulement les messages, en plein écran -->
  <div class="screensaver" id="screensaver" hidden>
    <div class="ss-band">
      <div class="ticker-track" id="ss-track"></div>
    </div>
    <p class="ss-hint">Touchez l’écran pour revenir</p>
  </div>

  <!-- Petite fenêtre d'information -->
  <div class="modal" id="notice" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="notice-title">
      <button class="icon-btn modal-close" data-close type="button" aria-label="Fermer">✕</button>
      <h2 id="notice-title"></h2>
      <div class="notice-body" id="notice-body"></div>
      <div class="form-actions" id="notice-actions"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <noscript>Cette application a besoin de JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
